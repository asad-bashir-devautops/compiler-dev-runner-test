name: Compiler smoke test

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: compiler-2cpu
    timeout-minutes: 5

    steps:
      - name: Check the runner
        shell: bash
        run: |
          echo "Hello from Compiler!"
          echo "Runner: $RUNNER_NAME"
          uname -sm
          pwd

          echo "Compiler works" > compiler-test.txt
          ls -lah
          cat compiler-test.txt

          test "$(cat compiler-test.txt)" = "Compiler works"
          echo "Smoke test passed"
